<style>

  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; line-height: 1.65; }

  .wrap { max-width: 760px; margin: 0 auto; }

  .eyebrow { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

  .visits { display: inline-block; font-size: 0.8rem; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 0.25rem 0.7rem; border-radius: 999px; margin-bottom: 0.7rem; }

  #levelScreen .level-btn { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 0.9rem; cursor: pointer; box-shadow: var(--shadow); }

  .qcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem 1.7rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }

  .opt input { margin-top: 0.2rem; accent-color: var(--accent); }
  .opt span { font-size: 0.95rem; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)); }

  html[dir="rtl"] .explain { border-left: none; border-right: 3px solid var(--accent); }
  .explain.show { display: block; }

  .actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; flex-wrap: wrap; }
  button.primary { font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.95rem; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 0.75rem 1.6rem; cursor: pointer; }

  button.secondary { font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.95rem; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 0.75rem 1.6rem; cursor: pointer; }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 1.5rem 3rem; }
  footer a { color: var(--accent); }

  "visits": {"fr":"visite(s) sur ce test","en":"visit(s) on this test","es":"visita(s) en este test","ar":"زيارة لهذا الاختبار","pt":"visita(s) neste teste"}
};
  const levelScreen = document.getElementById('levelScreen');
  const quizScreen = document.getElementById('quizScreen');
  const form = document.getElementById('quizForm');
  const banner = document.getElementById('scoreBanner');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const levelBtn = document.getElementById('levelBtn');
  let currentLevel = null;
  let currentLang = 'fr';
  let visitCount = null;

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function tr(dict, lang) { return dict[lang] || dict.fr; }

  function renderQuiz(level, lang) {
    currentLevel = level;
    const QUIZ = LEVELS[level];
    form.innerHTML = QUIZ.map(function(q, i) {
      const opts = tr(q.options, lang).map(function(o, j) {
        return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '" required><span>' + esc(o) + '</span></label>';
      }).join('');
      return '<div class="qcard"><div class="qnum">' + esc(UI.questionLabel[lang] || UI.questionLabel.fr) + ' ' + (i+1) + ' / ' + QUIZ.length + '</div>' +
        '<p class="qtext">' + esc(tr(q.q, lang)) + '</p><div id="opts' + i + '">' + opts + '</div>' +
        '<div class="explain" id="explain' + i + '">💡 ' + esc(tr(q.explain, lang)) + '</div></div>';
    }).join('');
    banner.className = '';
    banner.innerHTML = '';
    submitBtn.style.display = 'inline-block';
    resetBtn.style.display = 'none';
    levelScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function applyStaticUI(lang) {
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.getElementById('backText').textContent = tr(UI.back, lang);
    document.getElementById('h1El').textContent = tr(UI.h1, lang);
    document.getElementById('subEl').textContent = tr(UI.sub, lang);
    document.getElementById('footerCopyEl').textContent = tr(UI.footerCopy, lang);
    document.getElementById('footerLinkEl').textContent = tr(UI.footerBack, lang);
    document.getElementById('levelDebTitle').textContent = tr(UI.levelDebTitle, lang);
    document.getElementById('levelDebDesc').textContent = tr(UI.levelDebDesc, lang);
    document.getElementById('levelIntTitle').textContent = tr(UI.levelIntTitle, lang);
    document.getElementById('levelIntDesc').textContent = tr(UI.levelIntDesc, lang);
    document.getElementById('levelAvaTitle').textContent = tr(UI.levelAvaTitle, lang);
    document.getElementById('levelAvaDesc').textContent = tr(UI.levelAvaDesc, lang);
    submitBtn.textContent = tr(UI.seeScore, lang);
    resetBtn.textContent = tr(UI.restart, lang);
    levelBtn.textContent = tr(UI.changeLevel, lang);
    if (visitCount !== null) {
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + (tr(UI.visits, lang));
    }
    document.querySelectorAll('#langSwitch button').forEach(function(b) { b.classList.toggle('active', b.dataset.lang === lang); });
  }

  function setLang(lang) {
    currentLang = lang;
    applyStaticUI(lang);
    if (currentLevel && quizScreen.style.display !== 'none') {
      renderQuiz(currentLevel, lang);
    }
    try { localStorage.setItem('site_lang', lang); } catch (e) {}
  }

  document.querySelectorAll('.level-btn').forEach(function(b) {
    b.addEventListener('click', function() { renderQuiz(b.dataset.level, currentLang); });
  });
  document.querySelectorAll('#langSwitch button').forEach(function(b) {
    b.addEventListener('click', function() { setLang(b.dataset.lang); });
  });

  levelBtn.addEventListener('click', function() {
    quizScreen.style.display = 'none';
    levelScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const QUIZ = LEVELS[currentLevel];
    let score = 0;
    QUIZ.forEach(function(q, i) {
      const chosen = form.querySelector('input[name="q' + i + '"]:checked');
      const opts = document.querySelectorAll('#opts' + i + ' .opt');
      opts.forEach(function(el, j) {
        el.classList.remove('correct', 'incorrect');
        if (j === q.correct) el.classList.add('correct');
        else if (chosen && parseInt(chosen.value) === j) el.classList.add('incorrect');
      });
      document.getElementById('explain' + i).classList.add('show');
      if (chosen && parseInt(chosen.value) === q.correct) score++;
      form.querySelectorAll('input[name="q' + i + '"]').forEach(function(inp) { inp.disabled = true; });
    });
    const pct = Math.round((score / QUIZ.length) * 100);
    let tier = 'tier-low', msg = tr(UI.tierLow, currentLang);
    if (pct >= 80) { tier = 'tier-high'; msg = tr(UI.tierHigh, currentLang); }
    else if (pct >= 50) { tier = 'tier-mid'; msg = tr(UI.tierMid, currentLang); }
    banner.className = 'show ' + tier;
    banner.innerHTML = esc(tr(UI.scoreLabel, currentLang)) + ' : ' + score + ' / ' + QUIZ.length + ' (' + pct + ' %)<p>' + esc(msg) + '</p>';
    banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    submitBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
  });

  resetBtn.addEventListener('click', function() { renderQuiz(currentLevel, currentLang); });

  fetch('https://abacus.jasoncameron.dev/hit/mediateur-numerique/ameli-quiz')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      visitCount = d.value;
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + tr(UI.visits, currentLang);
    })
    .catch(function() { document.getElementById('visitsCounter').style.display = 'none'; });

  let __savedLang = 'fr';
  try { __savedLang = localStorage.getItem('site_lang') || 'fr'; } catch (e) {}
  setLang(__savedLang);
</script>
</body>
</html>
