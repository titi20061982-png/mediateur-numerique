teur empêche-t-il d\u0027être suivi par les sites visités ?","options":["Oui, totalement","Non, il empêche surtout de garder l\u0027historique local sur l\u0027appareil","Oui, mais seulement sur mobile","Cela dépend du jour de la semaine"],"explain":"La navigation privée n\u0027enregistre pas l\u0027historique localement, mais les sites visités peuvent toujours vous suivre.","correct":1},{"q":"Partager publiquement sa position en temps réel sur les réseaux sociaux peut :","options":["N\u0027avoir aucune conséquence","Révéler où vous habitez ou vous trouvez à des inconnus","Améliorer la sécurité de votre compte","Être obligatoire"],"explain":"Partager sa localisation en temps réel publiquement peut révéler des informations sensibles à des personnes malintentionnées.","correct":1},{"q":"Faut-il verrouiller son téléphone avec un code ou une empreinte ?","options":["Non, ce n\u0027est pas utile","Oui, pour protéger ses données en cas de perte ou de vol","Seulement la nuit","Seulement pour les professionnels"],"explain":"Verrouiller son téléphone protège vos données personnelles si l\u0027appareil est perdu ou volé.","correct":1},{"q":"Faut-il se méfier des questions de sécurité trop personnelles (nom de son animal, ville de naissance...) ?","options":["Non, elles sont toujours sûres","Oui, ces informations peuvent parfois être devinées ou trouvées en ligne","Non, elles remplacent le mot de passe","Oui, mais uniquement sur mobile"],"explain":"Des informations personnelles trop faciles à deviner ou trouvables sur les réseaux sociaux affaiblissent la sécurité d\u0027un compte.","correct":1}],"intermediaire":[{"q":"Un bon mot de passe doit être :","options":["Le même partout pour s\u0027en souvenir","Unique par site et généré aléatoirement","Une date de naissance","Court et simple"],"explain":"Un mot de passe unique et aléatoire par site limite les dégâts en cas de fuite de données sur un seul service.","correct":1},{"q":"Parmi les méthodes de double authentification (2FA), la plus vulnérable est :","options":["Une clé physique (YubiKey)","Une application d\u0027authentification (TOTP)","Le SMS","Une empreinte digitale"],"explain":"Le SMS est vulnérable au \"SIM swap\" (usurpation de la carte SIM), contrairement à une appli TOTP ou une clé physique.","correct":2},{"q":"Sur un Wi-Fi public, il est recommandé d\u0027utiliser :","options":["Rien de spécial","Un VPN de confiance","Le Bluetooth activé en permanence","Le mode avion"],"explain":"Un VPN de confiance chiffre votre connexion, essentiel sur un Wi-Fi public non sécurisé.","correct":1},{"q":"Un exemple typique de domaine de phishing (faux site) est :","options":["google.com","amaz0n.fr (avec un zéro à la place du o)","wikipedia.org","gouv.fr"],"explain":"Les faux sites imitent souvent l\u0027adresse officielle avec de petites variations (lettres remplacées par des chiffres, etc.).","correct":1},{"q":"Pour ranger ses mots de passe en sécurité, on utilise :","options":["Un fichier Excel","Un gestionnaire de mots de passe (Bitwarden, KeePassXC...)","Un post-it","Le même mot de passe partout"],"explain":"Un gestionnaire de mots de passe chiffré stocke et génère des mots de passe uniques et solides pour chaque site.","correct":1},{"q":"DuckDuckGo est un exemple de :","options":["Réseau social","Moteur de recherche respectueux de la vie privée","Antivirus","Gestionnaire de mots de passe"],"explain":"DuckDuckGo, comme Startpage ou Brave Search, ne trace pas vos recherches contrairement à Google.","correct":1},{"q":"Le RGPD (Règlement Général sur la Protection des Données) donne notamment le droit de :","options":["Accéder à ses données et en demander la suppression","Obliger tous les sites à être gratuits","Interdire totalement la publicité","Supprimer le compte d\u0027un tiers"],"explain":"Le RGPD donne aux citoyens européens des droits sur leurs données : accès, rectification, suppression, portabilité.","correct":0},{"q":"En France, la CNIL est chargée de :","options":["Gérer les impôts","Veiller au respect de la protection des données personnelles","Délivrer les cartes d\u0027identité","Gérer les remboursements de santé"],"explain":"La CNIL (Commission Nationale de l\u0027Informatique et des Libertés) veille au respect de la vie privée et des données personnelles.","correct":1},{"q":"Un VPN sert principalement à :","options":["Accélérer le processeur","Chiffrer sa connexion et masquer son adresse IP","Supprimer les virus","Créer des mots de passe"],"explain":"Un VPN chiffre le trafic Internet et masque l\u0027adresse IP réelle de l\u0027utilisateur.","correct":1},{"q":"Le \"tracking\" publicitaire consiste à :","options":["Bloquer les publicités","Suivre votre navigation pour vous proposer des publicités ciblées","Créer un compte email","Réparer un ordinateur"],"explain":"Le tracking publicitaire suit votre comportement en ligne pour vous afficher des publicités personnalisées.","correct":1}],"avance":[{"q":"Quel réglage protège les données d\u0027un ordinateur même s\u0027il est volé ?","options":["Le pare-feu","Le chiffrement du disque (BitLocker / FileVault)","L\u0027antivirus","Le VPN"],"explain":"Le chiffrement complet du disque (BitLocker sous Windows, FileVault sous macOS) protège les données en cas de vol.","correct":1},{"q":"NextDNS et Cloudflare 1.1.1.1, cités dans la fiche, sont des exemples de :","options":["VPN","DNS chiffrés","Antivirus","Réseaux sociaux"],"explain":"NextDNS et Cloudflare 1.1.1.1 sont des services de DNS chiffré, recommandés dans le plan d\u0027action avancé.","correct":1},{"q":"Dans le plan d\u0027action \"avancé\" de la fiche, quel outil est recommandé pour la navigation la plus sensible ?","options":["Chrome en navigation privée","Tor","Internet Explorer","Bing"],"explain":"Tor est recommandé dans le plan d\u0027action avancé pour la navigation la plus sensible.","correct":1},{"q":"Le \"fingerprinting\" (empreinte du navigateur) permet de vous suivre :","options":["Uniquement via les cookies","Même sans cookies,  le maximum de données possible","Une entreprise ne doit collecter que les données strictement nécessaires à son service","Les données doivent être stockées le plus longtemps possible","Ce principe ne s\u0027applique qu\u0027aux administrations"],"explain":"Le RGPD impose de ne collecter que les données réellement nécessaires à la finalité du service proposé.","correct":1},{"q":"Une clé de sécurité physique (comme une YubiKey) protège un compte :","options":["Moins bien qu\u0027un simple mot de passe","Même si le mot de passe a été volé, sans la clé physique personne ne peut se connecter","Uniquement contre les virus","Uniquement sur ordinateur, jamais sur mobile"],"explain":"Une clé de sécurité physique constitue un second facteur d\u0027authentification très robuste : sans elle, un mot de passe volé ne suffit pas à se connecter.","correct":1}]};
  const FR_UI = {
    back:"Retour aux ateliers", sub:"Ateliers Médiation Numérique — Cédric Waltener",
    footerCopy:"Reproduction interdite sans autorisation.", footerBack:"Retour au site",
    h1:"Test de connaissances",
    levelDebTitle:"🌱 Débutant", levelDebDesc:"Questions simples pour commencer en douceur.",
    levelIntTitle:"🌿 Intermédiaire", levelIntDesc:"Le niveau standard, pour vérifier ses acquis.",
    levelAvaTitle:"🌳 Avancé", levelAvaDesc:"Questions plus précises, pour aller plus loin.",
    seeScore:"Voir mon score", restart:"Recommencer", changeLevel:"Changer de niveau",
    questionLabel:"Question", scoreLabel:"Score",
    tierLow:"À revoir ! Relisez la fiche de l'atelier et retentez le test.",
    tierMid:"Pas mal ! Encore quelques points à consolider.",
    tierHigh:"Excellent ! Vous maîtrisez bien le sujet.",
    visits:"visite(s) sur ce test",
    recapLevelLabel:"Niveau atteint", recapImproveLabel:"Points à améliorer",
    recapNoImprove:"Aucun — bravo !",
    recapColQuestion:"Question", recapColYourAnswer:"Réponse donnée",
    recapColCorrectAnswer:"Bonne réponse", recapColResult:"Résultat",
    recapNoAnswer:"(pas de réponse)",
    recapRestart:"Recommencer le quiz", recapHome:"Retour au site",
    recapAdviceLabel:"Conseil",
    recapAdviceLow:"Reprenez la fiche de l'atelier avant de retenter le quiz, en particulier les points ci-dessus. Il n'y a pas de mauvaise question, seulement des essais qui font progresser.",
    recapAdviceMid:"Vous avez les bases ! Relisez les explications des questions ratées pour bien les fixer, puis retentez le quiz quand vous êtes prêt.",
    recapAdviceHigh:"Niveau maîtrisé, bravo ! Vous pouvez passer au niveau supérieur ou explorer un autre atelier.",
    recapCopyBtn:"📋 Copier le compte rendu", recapCopied:"✅ Copié !",
    recapReportTitle:"Compte rendu", recapDetailLabel:"Détail des réponses"
  };

  const cache = { fr: { ui: FR_UI, levels: FR_LEVELS } };
  const levelScreen = document.getElementById('levelScreen');
  const quizScreen = document.getElementById('quizScreen');
  const form = document.getElementById('quizForm');
  const banner = document.getElementById('scoreBanner');
  const recapWrap = document.getElementById('recapWrap');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const levelBtn = document.getElementById('levelBtn');
  const langSelect = document.getElementById('langSelect');
  const langLoading = document.getElementById('langLoading');
  let currentLevel = null;
  let currentLang = 'fr';
  let visitCount = null;

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function launchConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#35604f', '#b6562f', '#2b5d8a', '#e0b04a', '#83c1a6'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const size = 6 + Math.random() * 6;
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.width = size + 'px';
      el.style.height = (size * 0.4) + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      el.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(el);
      setTimeout(function () { el.remove(); }, 4200);
    }
  }

  function levelLabel(level, UI) {
    if (level === 'debutant') return UI.levelDebTitle;
    if (level === 'intermediaire') return UI.levelIntTitle;
    return UI.levelAvaTitle;
  }

  // Construit le compte rendu en texte brut (pour copie / envoi a distance).
  function buildReportText(level, lang, answers, score, total, pct, adviceText) {
    const UI = cache[lang].ui;
    const wrong = answers.filter(function(a) { return !a.isCorrect; }).map(function(a) { return a.question; });
    const workshopName = document.getElementById('eyebrowEl').textContent + ' — ' + document.getElementById('h1El').textContent;
    let out = UI.recapReportTitle + ' — ' + workshopName + '\n';
    out += UI.recapLevelLabel + ' : ' + levelLabel(level, UI) + '\n';
    out += UI.scoreLabel + ' : ' + score + ' / ' + total + ' (' + pct + ' %)\n\n';
    out += UI.recapDetailLabel + ' :\n';
    answers.forEach(function(a, i) {
      out += (i + 1) + '. [' + (a.isCorrect ? '✔' : '✖') + '] ' + a.question + '\n';
      out += '   ' + UI.recapColYourAnswer + ' : ' + a.chosenText + '\n';
      if (!a.isCorrect) out += '   ' + UI.recapColCorrectAnswer + ' : ' + a.correctText + '\n';
    });
    out += '\n' + UI.recapImproveLabel + ' :\n';
    out += wrong.length ? wrong.map(function(q) { return '- ' + q; }).join('\n') : UI.recapNoImprove;
    out += '\n\n' + UI.recapAdviceLabel + ' : ' + adviceText + '\n';
    out += '\n— Ateliers Médiation Numérique, Cédric Waltener';
    return out;
  }

  // Compte rendu visuel : tableau recapitulatif + synthese, affiches apres validation.
  function renderRecap(level, lang, answers, score, total, pct) {
    const UI = cache[lang].ui;
    const rows = answers.map(function(a) {
      const mark = a.isCorrect
        ? '<span style="color:var(--good);font-weight:700;">✔</span>'
        : '<span style="color:var(--bad);font-weight:700;">❌</span>';
      return '<tr>' +
        '<td>' + esc(a.question) + '</td>' +
        '<td>' + esc(a.chosenText) + '</td>' +
        '<td>' + esc(a.correctText) + '</td>' +
        '<td style="text-align:center;">' + mark + '</td>' +
        '</tr>';
    }).join('');

    const wrong = answers.filter(function(a) { return !a.isCorrect; }).map(function(a) { return a.question; });
    const improveHtml = wrong.length
      ? '<ul>' + wrong.map(function(q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul>'
      : '<p>' + esc(UI.recapNoImprove) + '</p>';

    const adviceText = pct >= 80 ? UI.recapAdviceHigh : (pct >= 50 ? UI.recapAdviceMid : UI.recapAdviceLow);

    recapWrap.innerHTML =
      '<div id="recapSynthesis">' +
        '<p><strong>' + esc(UI.recapLevelLabel) + ' :</strong> ' + esc(levelLabel(level, UI)) + '</p>' +
        '<p><strong>' + esc(UI.recapImproveLabel) + ' :</strong></p>' +
        improveHtml +
        '<p><strong>' + esc(UI.recapAdviceLabel) + ' :</strong> ' + esc(adviceText) + '</p>' +
      '</div>' +
      '<div id="recapTableWrap">' +
        '<table id="recapTable">' +
          '<thead><tr>' +
            '<th>' + esc(UI.recapColQuestion) + '</th>' +
            '<th>' + esc(UI.recapColYourAnswer) + '</th>' +
            '<th>' + esc(UI.recapColCorrectAnswer) + '</th>' +
            '<th>' + esc(UI.recapColResult) + '</th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
      '<div class="actions">' +
        '<button type="button" class="primary" id="recapRestartBtn">' + esc(UI.recapRestart) + '</button>' +
        '<button type="button" class="secondary" id="recapCopyBtn">' + esc(UI.recapCopyBtn) + '</button>' +
        '<button type="button" class="secondary" id="recapHomeBtn">' + esc(UI.recapHome) + '</button>' +
      '</div>';
    recapWrap.style.display = 'block';

    document.getElementById('recapRestartBtn').addEventListener('click', function() {
      renderQuiz(currentLevel, currentLang);
    });
    document.getElementById('recapHomeBtn').addEventListener('click', function() {
      window.location.href = '../index.html';
    });
    document.getElementById('recapCopyBtn').addEventListener('click', function() {
      const text = buildReportText(level, lang, answers, score, total, pct, adviceText);
      const copyBtn = document.getElementById('recapCopyBtn');
      const original = UI.recapCopyBtn;
      function showCopied() {
        copyBtn.textContent = UI.recapCopied;
        setTimeout(function() { copyBtn.textContent = original; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function() { fallbackCopy(text, showCopied); });
      } else {
        fallbackCopy(text, showCopied);
      }
    });
  }

  function fallbackCopy(text, onDone) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (onDone) onDone();
  }

  function renderQuiz(level, lang) {
    currentLevel = level;
    const QUIZ = cache[lang].levels[level];
    form.innerHTML = QUIZ.map(function(q, i) {
      const opts = q.options.map(function(o, j) {
        return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '" required><span>' + esc(o) + '</span></label>';
      }).join('');
      return '<div class="qcard"><div class="qnum">' + esc(cache[lang].ui.questionLabel) + ' ' + (i+1) + ' / ' + QUIZ.length + '</div>' +
        '<p class="qtext">' + esc(q.q) + '</p><div id="opts' + i + '">' + opts + '</div>' +
        '<div class="explain" id="explain' + i + '">💡 ' + esc(q.explain) + '</div></div>';
    }).join('');
    banner.className = '';
    banner.innerHTML = '';
    recapWrap.style.display = 'none';
    recapWrap.innerHTML = '';
    submitBtn.style.display = 'inline-block';
    resetBtn.style.display = 'none';
    levelScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function applyStaticUI(lang) {
    const UI = cache[lang].ui;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar' || lang === 'iw' || lang === 'ur' || lang === 'fa' || lang === 'ps' || lang === 'ckb' || lang === 'sd') ? 'rtl' : 'ltr';
    document.getElementById('backText').textContent = UI.back;
    document.getElementById('h1El').textContent = UI.h1;
    document.getElementById('subEl').textContent = UI.sub;
    document.getElementById('footerCopyEl').textContent = UI.footerCopy;
    document.getElementById('footerLinkEl').textContent = UI.footerBack;
    document.getElementById('levelDebTitle').textContent = UI.levelDebTitle;
    document.getElementById('levelDebDesc').textContent = UI.levelDebDesc;
    document.getElementById('levelIntTitle').textContent = UI.levelIntTitle;
    document.getElementById('levelIntDesc').textContent = UI.levelIntDesc;
    document.getElementById('levelAvaTitle').textContent = UI.levelAvaTitle;
    document.getElementById('levelAvaDesc').textContent = UI.levelAvaDesc;
    submitBtn.textContent = UI.seeScore;
    resetBtn.textContent = UI.restart;
    levelBtn.textContent = UI.changeLevel;
    if (visitCount !== null) {
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + UI.visits;
    }
  }

  function finishSetLang(lang) {
    currentLang = lang;
    applyStaticUI(lang);
    if (currentLevel && quizScreen.style.display !== 'none') {
      renderQuiz(currentLevel, lang);
    }
    try { localStorage.setItem('site_lang', lang); } catch (e) {}
    langLoading.classList.remove('show');
  }

  function setLang(lang) {
    if (cache[lang]) { finishSetLang(lang); return; }
    langLoading.classList.add('show');
    fetch('i18n/quiz-' + lang + '.json')
      .then(function(r) { if (!r.ok) throw new Error('missing'); return r.json(); })
      .then(function(data) {
        const entry = data.quizzes[SLUG];
        if (!entry) throw new Error('no slug');
        cache[lang] = { ui: data.ui, levels: entry };
        finishSetLang(lang);
      })
      .catch(function() {
        // langue pas encore disponible : on reste sur la langue actuelle
        langLoading.classList.remove('show');
        langSelect.value = currentLang;
      });
  }

  document.querySelectorAll('.level-btn').forEach(function(b) {
    b.addEventListener('click', function() { renderQuiz(b.dataset.level, currentLang); });
  });
  langSelect.addEventListener('change', function() { setLang(langSelect.value); });

  levelBtn.addEventListener('click', function() {
    quizScreen.style.display = 'none';
    levelScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const QUIZ = cache[currentLang].levels[currentLevel];
    const UI = cache[currentLang].ui;
    let score = 0;
    const answers = [];
    QUIZ.forEach(function(q, i) {
      const chosen = form.querySelector('input[name="q' + i + '"]:checked');
      const opts = document.querySelectorAll('#opts' + i + ' .opt');
      opts.forEach(function(el, j) {
        el.classList.remove('correct', 'incorrect');
        if (j === q.correct) el.classList.add('correct');
        else if (chosen && parseInt(chosen.value) === j) el.classList.add('incorrect');
      });
      document.getElementById('explain' + i).classList.add('show');
      const isCorrect = !!(chosen && parseInt(chosen.value) === q.correct);
      if (isCorrect) score++;
      answers.push({
        question: q.q,
        chosenText: chosen ? q.options[parseInt(chosen.value)] : UI.recapNoAnswer,
        correctText: q.options[q.correct],
        isCorrect: isCorrect
      });
      form.querySelectorAll('input[name="q' + i + '"]').forEach(function(inp) { inp.disabled = true; });
    });
    const pct = Math.round((score / QUIZ.length) * 100);
    let tier = 'tier-low', msg = UI.tierLow;
    if (pct >= 80) { tier = 'tier-high'; msg = UI.tierHigh; }
    else if (pct >= 50) { tier = 'tier-mid'; msg = UI.tierMid; }
    banner.className = 'show ' + tier;
    banner.innerHTML = esc(UI.scoreLabel) + ' : ' + score + ' / ' + QUIZ.length + ' (' + pct + ' %)<p>' + esc(msg) + '</p>';
    renderRecap(currentLevel, currentLang, answers, score, QUIZ.length, pct);
    banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (tier === 'tier-high') { launchConfetti(); }
    submitBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
  });

  resetBtn.addEventListener('click', function() { renderQuiz(currentLevel, currentLang); });

  fetch('https://abacus.jasoncameron.dev/hit/mediateur-numerique-2026/vie-privee-quiz')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      visitCount = d.value;
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + cache[currentLang].ui.visits;
    })
    .catch(function() { document.getElementById('visitsCounter').style.display = 'none'; });

  let __savedLang = 'fr';
  try { __savedLang = localStorage.getItem('site_lang') || 'fr'; } catch (e) {}
  langSelect.value = __savedLang;
  if (langSelect.value !== __savedLang) { langSelect.value = 'fr'; __savedLang = 'fr'; }
  setLang(__savedLang);

  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    function sysDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
    function icon(t) { btn.textContent = (t || (sysDark() ? 'dark' : 'light')) === 'dark' ? '☀️' : '🌙'; }
    var savedTheme = null;
    try { savedTheme = localStorage.getItem('theme'); } catch (e) {}
    if (savedTheme === 'dark' || savedTheme === 'light') root.setAttribute('data-theme', savedTheme);
    icon(savedTheme);
    btn.addEventListener('click', function () {
      var cur = root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light');
      var next = cur === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      icon(next);
    });
  })();
  (function () {
    var backBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', function () { backBtn.classList.toggle('show', window.scrollY > 400); }, { passive: true });
    backBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var bar = document.getElementById('scrollProgress');
    function upd() {
      var h = document.documentElement;
      var s = h.scrollTop || document.body.scrollTop;
      var height = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;
      bar.style.width = (height > 0 ? (s / height) * 100 : 0) + '%';
    }
    window.addEventListener('scroll', upd, { passive: true });
    upd();
  })();
</script>
</body>
