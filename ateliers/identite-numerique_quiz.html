<style>
  :root {
    --bg: #f5f4f0; --bg-soft: #ece9e2; --card: #ffffff; --text: #211f1c;
    --muted: #6b6559; --border: #e2ded4; --accent: #35604f; --accent-2: #b6562f;
    --good: #2f7d4f; --bad: #b3432f;
    --shadow: 0 1px 2px rgba(30,25,15,.06), 0 10px 28px rgba(30,25,15,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181a; --bg-soft: #1b1f21; --card: #1e2224; --text: #eceae5;
      --muted: #a2a29c; --border: #2c3133; --accent: #83c1a6; --accent-2: #ef9169;
      --good: #6fcf97; --bad: #ef9169;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; line-height: 1.65; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; }
  header { background: var(--bg-soft); border-bottom: 1px solid var(--border); padding: 1.6rem 1.5rem; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .back { display: inline-block; margin-bottom: 0.9rem; color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
  .back:hover { text-decoration: underline; }
  .eyebrow { color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  h1 { margin: 0.3rem 0 0.2rem; font-size: clamp(1.5rem, 4vw, 2.1rem); }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 0.6rem; }
  .visits { display: inline-block; font-size: 0.8rem; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 0.25rem 0.7rem; border-radius: 999px; margin-bottom: 0.7rem; }
  .lang-select-wrap { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .lang-select-wrap select { font-family: "Inter", sans-serif; font-size: 0.85rem; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 0.4rem 0.7rem; border-radius: 999px; max-width: 220px; }
  .lang-loading { font-size: 0.8rem; color: var(--muted); display: none; }
  .lang-loading.show { display: inline; }
  html[dir="rtl"] .text-card, html[dir="rtl"] .qcard { text-align: right; }
  main { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.5rem 3rem; }

  #levelScreen .level-btn { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; margin-bottom: 0.9rem; cursor: pointer; box-shadow: var(--shadow); }
  html[dir="rtl"] #levelScreen .level-btn { text-align: right; }
  #levelScreen .level-btn:hover { border-color: var(--accent); }
  #levelScreen .level-btn strong { display: block; font-family: "Fraunces", Georgia, serif; font-size: 1.1rem; color: var(--accent); margin-bottom: 0.2rem; }
  #levelScreen .level-btn span { font-size: 0.88rem; color: var(--muted); }

  #scoreBanner { display: none; border-radius: 14px; padding: 1.3rem 1.6rem; margin-bottom: 1.8rem; font-family: "Fraunces", Georgia, serif; font-size: 1.15rem; font-weight: 600; box-shadow: var(--shadow); }
  #scoreBanner.show { display: block; }
  #scoreBanner.tier-low { background: color-mix(in srgb, var(--bad) 16%, var(--card)); color: var(--bad); border: 1px solid var(--bad); }
  #scoreBanner.tier-mid { background: color-mix(in srgb, var(--accent-2) 16%, var(--card)); color: var(--accent-2); border: 1px solid var(--accent-2); }
  #scoreBanner.tier-high { background: color-mix(in srgb, var(--good) 16%, var(--card)); color: var(--good); border: 1px solid var(--good); }
  #scoreBanner p { margin: 0.4rem 0 0; font-size: 0.92rem; font-weight: 400; color: var(--text); font-family: "Inter", sans-serif; }

  .qcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem 1.7rem; margin-bottom: 1.1rem; box-shadow: var(--shadow); }
  .qcard .qnum { color: var(--accent); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
  .qcard .qtext { font-size: 1.05rem; font-weight: 600; margin: 0 0 1rem; }
  .opt { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.65rem 0.8rem; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 0.55rem; cursor: pointer; transition: border-color .15s; }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 0.2rem; accent-color: var(--accent); }
  .opt span { font-size: 0.95rem; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--card)); }
  .opt.incorrect { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }
  .explain { display: none; margin-top: 0.8rem; padding: 0.8rem 1rem; border-radius: 10px; background: var(--bg-soft); font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--accent); }
  html[dir="rtl"] .explain { border-left: none; border-right: 3px solid var(--accent); }
  .explain.show { display: block; }

  .actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; flex-wrap: wrap; }
  button.primary { font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.95rem; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 0.75rem 1.6rem; cursor: pointer; }
  button.primary:hover { opacity: 0.9; }
  button.secondary { font-family: "Inter", sans-serif; font-weight: 600; font-size: 0.95rem; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 0.75rem 1.6rem; cursor: pointer; }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 1.5rem 3rem; }
  footer a { color: var(--accent); }
</style>

  const SLUG = "identite-numerique";
  const FR_LEVELS = {"debutant":[{"q":"L\u0027identité numérique, c\u0027est :","options":["Seulement votre carte d\u0027identité","L\u0027ensemble des traces que vous laissez sur Internet","Votre mot de passe","Votre adresse postale"],"explain":"L\u0027identité numérique regroupe l\u0027ensemble des traces, données et représentations laissées sur Internet.","correct":1},{"q":"Se \"googler\" veut dire :","options":["Créer un compte Google","Taper son propre nom dans un moteur de recherche","Payer pour de la publicité","Supprimer son compte"],"explain":"Se googler, c\u0027est rechercher son propre nom pour voir ce qui apparaît en ligne à son sujet.","correct":1},{"q":"L\u0027e-réputation est importante notamment pour :","options":["Personne en particulier","Votre image auprès des recruteurs et de vos proches","Seulement les célébrités","Seulement les entreprises"],"explain":"92 % des recruteurs vérifient la présence en ligne : l\u0027e-réputation concerne tout le monde.","correct":1}],"intermediaire":[{"q":"Quel pourcentage de recruteurs vérifient la présence en ligne des candidats ?","options":["30 %","50 %","92 %","100 %"],"explain":"92 % des recruteurs vérifient la présence en ligne des candidats avant de les recevoir.","correct":2},{"q":"L\u0027identité \"calculée\", c\u0027est :","options":["Ce que vous dites de vous-même","Ce que vous faites en ligne","Ce que les algorithmes déduisent de vous","Votre photo de profil"],"explain":"L\u0027identité calculée correspond aux déductions faites par les algorithmes à partir de votre comportement en ligne.","correct":2},{"q":"Le droit à l\u0027oubli (RGPD) permet de :","options":["Supprimer tout Internet","Demander le déréférencement de contenus vous concernant","Empêcher qu\u0027on parle de vous","Effacer son casier judiciaire"],"explain":"Le droit à l\u0027oubli permet de demander le déréférencement de certains contenus vous concernant auprès des moteurs de recherche.","correct":1},{"q":"Face à un contenu négatif sur soi en ligne, la bonne pratique est de :","options":["Le supprimer en le niant publiquement","Répondre vite, calmement et factuellement","Ignorer complètement","Créer un faux profil pour se défendre"],"explain":"Une réponse rapide, calme et factuelle est la meilleure gestion de crise en e-réputation.","correct":1},{"q":"Un outil comme Google Alerts sert à :","options":["Créer un CV","Être prévenu quand on parle de vous en ligne","Bloquer les publicités","Chiffrer ses emails"],"explain":"Google Alerts envoie une alerte dès que votre nom (ou un mot choisi) apparaît en ligne.","correct":1},{"q":"Que faut-il faire en premier pour auditer sa présence en ligne ?","options":["Supprimer tous ses comptes","Se \"googler\" soi-même","Changer de nom","Contacter un avocat"],"explain":"Se rechercher soi-même sur Google est la première étape pour savoir ce qui est visible vous concernant.","correct":1}],"avance":[{"q":"L\u0027identité \"déclarative\" correspond à :","options":["Ce que les algorithmes déduisent de vous","Ce que vous dites vous-même de vous (profils, publications)","Ce que vous faites en ligne","Vos données bancaires"],"explain":"L\u0027identité déclarative est ce que vous dites vous-même de vous, via vos profils et publications.","correct":1},{"q":"LinkedIn, About.me et Namechk sont cités dans la fiche comme des outils pour :","options":["La suppression de contenu","Le \"personal branding\" (construire son image professionnelle)","La cybersécurité","La messagerie chiffrée"],"explain":"Ces outils sont cités dans la catégorie \"personal branding\" pour construire son image en ligne.","correct":1},{"q":"Parmi les 4 étapes pour construire une e-réputation positive citées, laquelle vient en 3e position ?","options":["Auditer sa situation actuelle","Optimiser ses profils existants","Produire du contenu de valeur","Engager la conversation"],"explain":"L\u0027ordre donné est : auditer, optimiser ses profils, produire du contenu de valeur, puis engager la conversation.","correct":2}]};
  const FR_UI = {
    back:"Retour aux ateliers", sub:"Ateliers Médiation Numérique — Cédric Waltener",
    footerCopy:"Reproduction interdite sans autorisation.", footerBack:"Retour au site",
    h1:"Test de connaissances",
    levelDebTitle:"🌱 Débutant", levelDebDesc:"Questions simples pour commencer en douceur.",
    levelIntTitle:"🌿 Intermédiaire", levelIntDesc:"Le niveau standard, pour vérifier ses acquis.",
    levelAvaTitle:"🌳 Avancé", levelAvaDesc:"Questions plus précises, pour aller plus loin.",
    seeScore:"Voir mon score", restart:"Recommencer", changeLevel:"Changer de niveau",
    questionLabel:"Question", scoreLabel:"Score",
    tierLow:"À revoir ! Relisez la fiche de l'atelier et retentez le test.",
    tierMid:"Pas mal ! Encore quelques points à consolider.",
    tierHigh:"Excellent ! Vous maîtrisez bien le sujet.",
    visits:"visite(s) sur ce test"
  };

  const cache = { fr: { ui: FR_UI, levels: FR_LEVELS } };
  const levelScreen = document.getElementById('levelScreen');
  const quizScreen = document.getElementById('quizScreen');
  const form = document.getElementById('quizForm');
  const banner = document.getElementById('scoreBanner');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const levelBtn = document.getElementById('levelBtn');
  const langSelect = document.getElementById('langSelect');
  const langLoading = document.getElementById('langLoading');
  let currentLevel = null;
  let currentLang = 'fr';
  let visitCount = null;

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderQuiz(level, lang) {
    currentLevel = level;
    const QUIZ = cache[lang].levels[level];
    form.innerHTML = QUIZ.map(function(q, i) {
      const opts = q.options.map(function(o, j) {
        return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '" required><span>' + esc(o) + '</span></label>';
      }).join('');
      return '<div class="qcard"><div class="qnum">' + esc(cache[lang].ui.questionLabel) + ' ' + (i+1) + ' / ' + QUIZ.length + '</div>' +
        '<p class="qtext">' + esc(q.q) + '</p><div id="opts' + i + '">' + opts + '</div>' +
        '<div class="explain" id="explain' + i + '">💡 ' + esc(q.explain) + '</div></div>';
    }).join('');
    banner.className = '';
    banner.innerHTML = '';
    submitBtn.style.display = 'inline-block';
    resetBtn.style.display = 'none';
    levelScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function applyStaticUI(lang) {
    const UI = cache[lang].ui;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar' || lang === 'iw' || lang === 'ur' || lang === 'fa' || lang === 'ps' || lang === 'ckb' || lang === 'sd') ? 'rtl' : 'ltr';
    document.getElementById('backText').textContent = UI.back;
    document.getElementById('h1El').textContent = UI.h1;
    document.getElementById('subEl').textContent = UI.sub;
    document.getElementById('footerCopyEl').textContent = UI.footerCopy;
    document.getElementById('footerLinkEl').textContent = UI.footerBack;
    document.getElementById('levelDebTitle').textContent = UI.levelDebTitle;
    document.getElementById('levelDebDesc').textContent = UI.levelDebDesc;
    document.getElementById('levelIntTitle').textContent = UI.levelIntTitle;
    document.getElementById('levelIntDesc').textContent = UI.levelIntDesc;
    document.getElementById('levelAvaTitle').textContent = UI.levelAvaTitle;
    document.getElementById('levelAvaDesc').textContent = UI.levelAvaDesc;
    submitBtn.textContent = UI.seeScore;
    resetBtn.textContent = UI.restart;
    levelBtn.textContent = UI.changeLevel;
    if (visitCount !== null) {
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + UI.visits;
    }
  }

  function finishSetLang(lang) {
    currentLang = lang;
    applyStaticUI(lang);
    if (currentLevel && quizScreen.style.display !== 'none') {
      renderQuiz(currentLevel, lang);
    }
    try { localStorage.setItem('site_lang', lang); } catch (e) {}
    langLoading.classList.remove('show');
  }

  function setLang(lang) {
    if (cache[lang]) { finishSetLang(lang); return; }
    langLoading.classList.add('show');
    fetch('i18n/quiz-' + lang + '.json')
      .then(function(r) { if (!r.ok) throw new Error('missing'); return r.json(); })
      .then(function(data) {
        const entry = data.quizzes[SLUG];
        if (!entry) throw new Error('no slug');
        cache[lang] = { ui: data.ui, levels: entry };
        finishSetLang(lang);
      })
      .catch(function() {
        // langue pas encore disponible : on reste sur la langue actuelle
        langLoading.classList.remove('show');
        langSelect.value = currentLang;
      });
  }

  document.querySelectorAll('.level-btn').forEach(function(b) {
    b.addEventListener('click', function() { renderQuiz(b.dataset.level, currentLang); });
  });
  langSelect.addEventListener('change', function() { setLang(langSelect.value); });

  levelBtn.addEventListener('click', function() {
    quizScreen.style.display = 'none';
    levelScreen.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const QUIZ = cache[currentLang].levels[currentLevel];
    const UI = cache[currentLang].ui;
    let score = 0;
    QUIZ.forEach(function(q, i) {
      const chosen = form.querySelector('input[name="q' + i + '"]:checked');
      const opts = document.querySelectorAll('#opts' + i + ' .opt');
      opts.forEach(function(el, j) {
        el.classList.remove('correct', 'incorrect');
        if (j === q.correct) el.classList.add('correct');
        else if (chosen && parseInt(chosen.value) === j) el.classList.add('incorrect');
      });
      document.getElementById('explain' + i).classList.add('show');
      if (chosen && parseInt(chosen.value) === q.correct) score++;
      form.querySelectorAll('input[name="q' + i + '"]').forEach(function(inp) { inp.disabled = true; });
    });
    const pct = Math.round((score / QUIZ.length) * 100);
    let tier = 'tier-low', msg = UI.tierLow;
    if (pct >= 80) { tier = 'tier-high'; msg = UI.tierHigh; }
    else if (pct >= 50) { tier = 'tier-mid'; msg = UI.tierMid; }
    banner.className = 'show ' + tier;
    banner.innerHTML = esc(UI.scoreLabel) + ' : ' + score + ' / ' + QUIZ.length + ' (' + pct + ' %)<p>' + esc(msg) + '</p>';
    banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    submitBtn.style.display = 'none';
    resetBtn.style.display = 'inline-block';
  });

  resetBtn.addEventListener('click', function() { renderQuiz(currentLevel, currentLang); });

  fetch('https://abacus.jasoncameron.dev/hit/mediateur-numerique-2026/identite-numerique-quiz')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      visitCount = d.value;
      document.getElementById('visitsCounter').textContent = '👥 ' + visitCount + ' ' + cache[currentLang].ui.visits;
    })
    .catch(function() { document.getElementById('visitsCounter').style.display = 'none'; });

  let __savedLang = 'fr';
  try { __savedLang = localStorage.getItem('site_lang') || 'fr'; } catch (e) {}
  langSelect.value = __savedLang;
  if (langSelect.value !== __savedLang) { langSelect.value = 'fr'; __savedLang = 'fr'; }
  setLang(__savedLang);
</script>
</body>
</html>
