<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Ateliers Médiation Numérique</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0; --bg-soft: #ece9e2; --card: #ffffff; --text: #211f1c;
    --muted: #6b6559; --border: #e2ded4; --accent: #35604f; --accent-2: #b6562f;
    --shadow: 0 1px 2px rgba(30,25,15,.06), 0 10px 28px rgba(30,25,15,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181a; --bg-soft: #1b1f21; --card: #1e2224; --text: #eceae5;
      --muted: #a2a29c; --border: #2c3133; --accent: #83c1a6; --accent-2: #ef9169;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: "Inter", sans-serif; line-height: 1.6; text-align: center; padding: 2rem 1.5rem;
  }
  .wrap { max-width: 480px; }
  .logo { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 1.4rem; box-shadow: var(--shadow); }
  .code { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 4.5rem; color: var(--accent); margin: 0; line-height: 1; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.4rem; margin: 0.6rem 0 0.6rem; }
  p { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.6rem; }
  .actions { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: 0.9rem;
    padding: 0.7rem 1.4rem; border-radius: 999px; transition: transform .15s ease, opacity .15s ease;
  }
  a.btn.primary { background: var(--accent); color: #fff; }
  a.btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  a.btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="">
    <p class="code">404</p>
    <h1>Cette page n'existe pas (ou plus)</h1>
    <p>Le lien est peut-être mal orthographié, ou la page a été déplacée. Retournez à l'accueil pour retrouver les 17 ateliers.</p>
    <div class="actions">
      <a class="btn primary" href="index.html">← Retour aux ateliers</a>
      <a class="btn secondary" href="stats.html">📊 Statistiques</a>
    </div>
  </div>
</body>
</html>
